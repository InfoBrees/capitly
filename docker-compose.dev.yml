services:
  traefik:
    image: traefik:v3.7
    command:
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.network=proxy
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "80:80"
      - "8080:8080" # Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy

  auth:
    build:
      context: capitly
      dockerfile: auth/Dockerfile.dev
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.auth.rule=PathPrefix(`/auth`)"
      - "traefik.http.routers.auth.priority=100"
      - "traefik.http.middlewares.auth-strip.stripprefix.prefixes=/auth"
      - "traefik.http.routers.auth.middlewares=auth-strip"
      - "traefik.http.services.auth.loadbalancer.server.port=8080"
    depends_on:
      postgres_auth:
        condition: service_healthy
    networks:
      - auth
      - proxy

  postgres_auth:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: capitly_auth
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/
    networks:
      - auth
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d capitly_auth"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    image: nginx:alpine
    ports: 
      - "3000:80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    networks:
      - proxy


  core:
    image: traefik/whoami
    ports:
      - "8082:80"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.core.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.core.priority=100"
      - "traefik.http.services.core.loadbalancer.server.port=80"
    depends_on:
      postgres_core:
        condition: service_healthy
    networks:
      - proxy
      - core

  postgres_core:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: capitly_core
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_core_data:/var/lib/postgresql/
    networks:
      - core
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d capitly_core"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  proxy:
    name: proxy
  auth:
  core:

volumes:
  postgres_auth_data:
  postgres_core_data: